name: Epistemic Drift Detection

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  drift-detect:
    name: Red-team the Elder
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run dev &
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - run: npx wait-on http://localhost:3000 --timeout 60000
      - name: Validate Chol Qij engine
        run: python3 scripts/validate-chol-qij.py
      - name: Signal system test
        run: node scripts/signal-system-test.mjs
        env:
          ELDER_URL: http://localhost:3000
      - name: Lineage purity regression
        run: node scripts/lineage-purity.mjs
        env:
          ELDER_URL: http://localhost:3000
      - run: node scripts/drift-detect.mjs
        env:
          ELDER_URL: http://localhost:3000
