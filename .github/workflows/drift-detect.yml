name: Epistemic Drift Detection
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
  issues: write   # the flaky-probe reporter step files/dedupes issues (#135)

jobs:
  drift-detect:
    name: Red-team the Elder
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      RATE_LIMIT_PER_DAY: "100"
      ELDER_CORPUS_VERSION: ${{ secrets.ELDER_CORPUS_VERSION }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      # Best-of-N gate (#135): drift-detect.mjs and lineage-purity.mjs
      # re-run a failing probe once; a first-attempt-only failure is
      # appended here as one JSON line and turned into a deduped issue by
      # the "Report flaky red-team probes" step below, instead of blocking.
      FLAKE_LOG: ${{ github.workspace }}/flaky-probes.jsonl
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci
      - name: Schema/view drift check (strict on main push)
        if: github.event_name == 'push'
        run: node scripts/check-schema-drift.mjs
      - name: Schema/view drift check (advisory on PR)
        if: github.event_name == 'pull_request'
        run: |
          node scripts/check-schema-drift.mjs || echo "WARNING: schema-drift advisory failure on PR; strict enforcement remains on main push"
      - name: "Preflight: VOYAGE_API_KEY present"
        id: voyage_preflight
        run: |
          if [ -z "${VOYAGE_API_KEY:-}" ]; then
            echo "::warning title=Corpus retrieval test skipped::VOYAGE_API_KEY is not set as a GitHub Actions repo secret (Settings -> Secrets and variables -> Actions). It being set in Vercel does NOT propagate here -- separate stores. Skipping the integration test rather than failing the build on a setup gap, not a code regression."
            echo "skip_corpus_test=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip_corpus_test=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          VOYAGE_API_KEY: ${{ secrets.VOYAGE_API_KEY }}
      - name: Corpus retrieval integration test (strict on main push)
        if: github.event_name == 'push' && steps.voyage_preflight.outputs.skip_corpus_test == 'false'
        run: npm run test:corpus-retrieval
        env:
          VOYAGE_API_KEY: ${{ secrets.VOYAGE_API_KEY }}
      - name: Corpus retrieval integration test (advisory on PR)
        if: github.event_name == 'pull_request' && steps.voyage_preflight.outputs.skip_corpus_test == 'false'
        run: |
          npm run test:corpus-retrieval || echo "WARNING: corpus-retrieval advisory failure on PR; strict enforcement remains on main push"
        env:
          VOYAGE_API_KEY: ${{ secrets.VOYAGE_API_KEY }}
      - name: Narrative governance consistency
        run: node scripts/check-narrative-tiers.mjs
      - run: npm run dev &
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - run: npx wait-on http://localhost:3000 --timeout 60000
      # CI-05/CI-01 fix (2026-08-19): wait-on above only proves the port is
      # listening. Next.js/Turbopack compiles each route lazily, on its
      # first hit -- so signal-system-test.mjs and lineage-purity.mjs used
      # to run against a /api/divine that hadn't compiled yet, got Next's
      # HTML "still compiling" shell back instead of JSON, and both scripts
      # silently treated that as SKIP rather than a real result. Worse,
      # signal-system-test.mjs then printed "Signal system: PASS" with
      # zero probes actually run -- a skip and a real pass were
      # indistinguishable in the check's own output. This step forces that
      # first compile to happen here, where a failure is visible, instead
      # of silently inside the next two steps. The POST body is
      # deliberately invalid (no `messages`) so this returns a fast 400
      # JSON error the instant the route is compiled, rather than
      # triggering a real (slow, rate-limited, API-cost-incurring)
      # generation just to prove the route exists.
      - name: Wait for /api/divine to actually compile (not just the port)
        run: |
          echo "Polling POST /api/divine for a real JSON response (proves the route is compiled, not just that the port answers)..."
          for i in $(seq 1 30); do
            body=$(curl -s -X POST http://localhost:3000/api/divine \
              -H "Content-Type: application/json" \
              -d '{}' \
              --max-time 10 || true)
            if echo "$body" | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>{try{JSON.parse(d);process.exit(0)}catch{process.exit(1)}})"; then
              echo "/api/divine is compiled and serving real JSON (took ~$((i * 2))s of polling)."
              exit 0
            fi
            sleep 2
          done
          echo "::error::/api/divine never returned valid JSON within 60s of polling -- it may still be compiling, or may be broken outright. Failing here instead of letting the next two steps silently SKIP and report PASS."
          exit 1
      - name: Validate Chol Qij engine
        run: python3 scripts/validate-chol-qij.py
      - name: Signal system test
        run: node scripts/signal-system-test.mjs
        env:
          ELDER_URL: http://localhost:3000
      - name: Lineage purity regression
        run: node scripts/lineage-purity.mjs
        env:
          ELDER_URL: http://localhost:3000
      - name: Drift detect (strict on main push)
        if: github.event_name == 'push'
        run: node scripts/drift-detect.mjs
        env:
          ELDER_URL: http://localhost:3000

      - name: Drift detect (advisory on PR)
        if: github.event_name == 'pull_request'
        run: |
          if [ -f scripts/drift-detect.mjs ]; then
            node scripts/drift-detect.mjs || echo "WARNING: drift-detect advisory failure on PR; strict enforcement remains on main push"
          else
            echo "WARNING: scripts/drift-detect.mjs not found in this ref; skipping advisory drift-detect"
          fi
        env:
          ELDER_URL: http://localhost:3000
      - name: Welfare gate probe (strict on main push)
        if: github.event_name == 'push'
        run: node scripts/welfare-gate-probe.mjs
        env:
          ELDER_URL: http://localhost:3000

      - name: Welfare gate probe (advisory on PR)
        if: github.event_name == 'pull_request'
        run: |
          node scripts/welfare-gate-probe.mjs || echo "WARNING: welfare-gate-probe advisory failure on PR; strict enforcement remains on main push"
        env:
          ELDER_URL: http://localhost:3000
      - name: Blue team pass (strict on main push)
        if: github.event_name == 'push' && success()
        run: node scripts/generative-probe.mjs --matrix --limit 2
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Blue team pass (advisory on PR)
        if: github.event_name == 'pull_request' && success()
        run: |
          node scripts/generative-probe.mjs --matrix --limit 2 || echo "WARNING: blue-team matrix advisory failure on PR; strict enforcement remains on main push"
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      # Best-of-N gate (#135). Runs regardless of the suite's verdict: a
      # first-attempt-only probe failure that passed on re-run did NOT
      # block, but is still real signal -- file it as a deduped issue so a
      # nondeterministic regression can't just scroll past in the log.
      - name: Report flaky red-team probes
        if: always() && hashFiles('flaky-probes.jsonl') != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          echo "Flaky probes recorded this run:"
          cat flaky-probes.jsonl || true
          jq -r '[.script, (.id | tostring), (.detail // "no detail")] | @tsv' flaky-probes.jsonl | sort -u \
            | while IFS="$(printf '\t')" read -r script id detail; do
                if [ -z "$script" ] || [ -z "$id" ]; then continue; fi
                title="flaky red-team probe: ${id} (${script})"
                existing="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title ${id} ${script} flaky" --json number --jq 'length' 2>/dev/null || echo 0)"
                if [ "${existing:-0}" != "0" ]; then
                  echo "  already tracked: ${title}"
                  continue
                fi
                {
                  printf 'The `%s` probe **%s** failed on its first generation this run, then PASSed on re-run, so it did NOT block the deploy (best-of-N gate, #135).\n\n' "$script" "$id"
                  printf 'First-attempt detail:\n\n> %s\n\n' "$detail"
                  printf 'Run: %s\n\n' "$RUN_URL"
                  printf 'The instrument produced a failing generation for this probe at least once. If it recurs it is a real (nondeterministic) regression -- see #135 for how the OR-03B case was handled.\n'
                } > /tmp/flake-body.md
                if gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body-file /tmp/flake-body.md; then
                  echo "  filed: ${title}"
                else
                  echo "  (could not create issue for ${title} -- continuing)"
                fi
              done
