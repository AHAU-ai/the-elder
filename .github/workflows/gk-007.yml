name: GK-007 Covenant Integrity Gate

on:
  push:
    branches:
      - main
      - feat/**
  pull_request:
    branches:
      - main

jobs:
  gk-007-governance:
    name: GK-007 Covenant Integrity Probe Suite
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run GK-007 Covenant Integrity Probes
        run: npm run gk-007 -- --verbose

      - name: Run PROBE-25 (DT category, strict on push)
        if: github.event_name == 'push'
        run: node scripts/adversarial-probe.mjs --category DT
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Run PROBE-25 (DT category, advisory on PR)
        if: github.event_name == 'pull_request'
        run: |
          if [ -z "${ANTHROPIC_API_KEY:-}" ]; then
            echo "WARNING: ANTHROPIC_API_KEY not available on this PR; skipping advisory PROBE-25"
            exit 0
          fi
          node scripts/adversarial-probe.mjs --category DT || echo "WARNING: PROBE-25 advisory failure on PR; strict enforcement remains on push"
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Run drift-detect verification
        run: npm run drift-detect
        continue-on-error: true

      - name: Report status
        if: always()
        run: |
          if [ $? -eq 0 ]; then
            echo "✅ GK-007 PASSED — Governance covenants verified"
          else
            echo "❌ GK-007 FAILED — Governance verification incomplete"
            exit 1
          fi
