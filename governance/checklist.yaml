- id: ELD-019
  status: IN PROGRESS
  phase: P2 · Beginning→Middle
  priority_band: High
  score: 20
  tier_group: TIER 2 — Structural / High Impact  [SHARED w/ THE ELDER]
  category: Engineering / Validation
  item: TypeScript Calendar Engine — Cross-Validation Against Reference Implementations
  description: |-
    The Chol Q'ij engine in lib/chol-qij.ts has never been formally cross-validated by an automated script against any reference implementation. Live verification this session found TWO independent reference implementations already exist: scripts/validate-chol-qij.py (Python, self-tests its own reimplementation against 500 dates from 1940-01-01, 3-day spacing -- but never imports or calls chol-qij.ts) and labaluka-site/src/lib/cholqij.mjs (JS, algebraically identical core cycle math, also never cross-called). Both reference implementations independently corroborate chol-qij.ts's anchor/cycle math on paper, BUT a real timezone-handling discrepancy was found: chol-qij.ts's deltaDays() uses LOCAL-timezone getters (getFullYear/getMonth/getDate) while cholqij.mjs uses UTC getters consistently -- these can disagree by one day near midnight boundaries depending on how birthdates are constructed upstream. No script today would catch this, since nothing actually calls chol-qij.ts programmatically against either reference.
  mitigation: |-
    Write a Node/ts-node script that imports lib/chol-qij.ts directly, runs the same 500+ date set used by validate-chol-qij.py, and diffs output against both reference implementations. Explicitly test dates near midnight in non-UTC timezones to catch the local-vs-UTC discrepancy. Flag any divergence before every deploy.
  steps: |-
    1.
       1.a Write ts-node script importing lib/chol-qij.ts directly
       1.b Run 500+ date set from validate-chol-qij.py; diff vs both references
       1.c Explicitly test near-midnight dates in non-UTC TZs (deltaDays local-getter bug)
    2.
       2.a Fix TZ discrepancy (standardize on UTC getters)
       2.b Add as pre-deploy CI check
  status_update: |-
    Two reference implementations corroborate the math on paper; the local-vs-UTC deltaDays discrepancy is a REAL latent bug no current script catches. Anchor: 2020-04-22 = 5 Kawoq, Imox-first (Stanzione-verified). | Original note: In progress per this session's findings -- two independent reference impls exist, TS cross-validation script still needed; flag TZ bug.
